# clarelay 设备组网和已有网站共用 80 / 443（Nginx 在前面按域名分流）
# 圈子域名以 relay.example.com 为例，换成你的；clarelay 启动参数：
#   --domain relay.example.com --bind 127.0.0.1 --listen-https 18443 --listen-http 18080 --proxy-protocol
#
# ① 443：nginx.conf 顶层（和 http {} 并列）加 stream，按 TLS 里的域名分流，不解开 HTTPS（端到端加密不变）
#    原来 http {} 里所有 `listen 443 ssl` 改成 `listen 127.0.0.1:4443 ssl`（别的配置不动）
stream {
    map $ssl_preread_server_name $clarelay_up {
        relay.example.com      clarelay;
        ~\.relay\.example\.com$ clarelay;
        default                web;
    }
    upstream clarelay { server 127.0.0.1:18443; }
    upstream web      { server 127.0.0.1:4443; }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $clarelay_up;
        proxy_protocol on;            # 只对 clarelay 有用；web 那边要在 listen 4443 上加 proxy_protocol 才能接（见下）
        proxy_connect_timeout 10s;
        proxy_timeout 1h;             # 长连接（WebSocket）
    }
}
# 注意：proxy_protocol on 对两个上游都生效。原来的网站要改成：
#    listen 127.0.0.1:4443 ssl proxy_protocol;
#    set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol;
# 不想动原网站的话，可以分成两个 server（一个 listen 443 专门 ssl_preread 后转发），见 README。
#
# ② 80：http {} 里加一个 server，把圈子域名的证书验证和跳转交给 clarelay
server {
    listen 80;
    server_name relay.example.com *.relay.example.com;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B21" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="clarelay">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>clarelay</title>
<style>
:root{--bg:#F1F3F5;--card:#FFFFFF;--fg:#14181C;--mut:#66707B;--line:#DDE1E6;--acc:#12864A;--acc-ink:#FFFFFF;--soft:#DDF3E6;--ok:#12864A;--bad:#D93636;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1115;--card:#161B21;--fg:#E7EBEF;--mut:#8B95A1;--line:#262D35;--acc:#3FCB86;--acc-ink:#0E1115;--soft:#173A2A;--ok:#3FCB86}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 13px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.bad{color:var(--bad)}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);width:100%}
.hidden{display:none!important}
#login{max-width:340px;margin:calc(18vh + var(--top)) auto 0;padding:24px;background:var(--card);border-radius:16px;border:1px solid var(--line)}
#login h1{margin:0 0 16px;font-size:22px}
#login input{margin-bottom:10px}
#login .err{color:var(--bad);min-height:1.4em;font-size:13px}
#app{display:flex;position:fixed;inset:0;height:100dvh}   /* iOS 主屏幕 App 里 height:100% 不到底，用 fixed 铺满整屏 */
/* 左栏（手机上是整屏）：标题 + 当前分页 + 底部菜单 */
#side{width:380px;flex:none;height:100%;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
#side>header{display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 12px) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
#side>header b{flex:1;font-size:18px}
#update{padding:10px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600;text-align:center;cursor:pointer}

#panes{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{padding:12px 12px 20px}
/* 宿主列表 */
.dev{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.dev:active{background:var(--soft)}
.dev.sel{border-color:var(--acc)}
.dev .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;position:relative}
.dev .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dev .ic .dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--mut);border:2px solid var(--card)}
.dev .ic .dot.on{background:var(--ok)}
.dev .nm{flex:1;min-width:0;font-weight:600}
.dev .nm small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .chev{flex:none;color:var(--mut)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.empty-tip{padding:40px 16px;color:var(--mut);text-align:center}
/* 管理 / 设置 */
.pane section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.pane h3{margin:0 0 8px;font-size:15px}
.pane .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pane h3+.row,.pane small+.row{border-top:0}
.pane .row .grow{flex:1;min-width:150px}
.pane .row small,.pane .tip{color:var(--mut);display:block;font-size:12.5px;word-break:break-all}
.out{word-break:break-all;font:12px ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:10px;margin-top:8px}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut);font-weight:400}
.pill.pending{color:#B45309;border-color:#F59E0B}
.pill.revoked{color:var(--bad);border-color:var(--bad)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
/* 底部菜单（和 claclaw 一样） */
#mtabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(var(--bot) + 4px)}
#mtabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;border:0;border-radius:8px;background:none;color:var(--mut);font-size:12px;font-weight:600}
#mtabs button.on{color:var(--acc)}
#mtabs .ti{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mtabs .ti .f{fill:currentColor;fill-opacity:0;transition:fill-opacity .15s}
#mtabs button.on .ti .f{fill-opacity:.22}
#mtabs button.dot::after{content:'';position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#F23C3C}
/* 右侧 / 进入宿主后的整屏 */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#bar{display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 6px) 10px 6px;border-bottom:1px solid var(--line);background:var(--card);min-height:calc(var(--top) + 50px)}
#bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#bar button{border:0;background:none;color:var(--acc);font-size:16px;padding:6px 8px}
#back{display:none}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#empty{padding:40px;color:var(--mut);text-align:center}
@media (max-width:760px){
  #side{width:100%;border-right:0}
  #main{display:none;position:fixed;inset:0;z-index:5}
  body.open #main{display:flex}
  #back{display:inline-block}
  #frames{margin-bottom:var(--bot)}
}

/* 设置：和 claclaw 一样的分组列表 */
.glabel{margin:16px 6px 8px;color:var(--mut);font-size:13px}
.glabel:first-child{margin-top:4px}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line);min-height:54px}
.item:first-child{border-top:0}
#reload-app,#push-test{cursor:pointer}
#reload-app:active,#push-test:active{background:var(--soft)}
.item .grow{flex:1;min-width:0}
.item small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.item .chev{color:var(--mut);font-size:20px}
.ri{width:24px;height:24px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 刷新时整页淡出，加载后淡入：明显能看出刷新了 */
#app{animation:appin .3s ease-out}
@keyframes appin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.leaving #app{opacity:.25;transition:opacity .25s}
#frames iframe.fading{opacity:.25;transition:opacity .2s}
/* 开关 */
input.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .2s}
input.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
input.sw:checked{background:var(--acc)}
input.sw:checked::after{left:22px}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>clarelay</h1>
  <input id="user" placeholder="用户名" autocomplete="username" autocapitalize="off">
  <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="pri" id="lbtn" style="width:100%">登录</button>
</div>
<div id="app" class="hidden">
  <aside id="side">
    <header><b id="ptitle">宿主</b><span id="total" class="badge hidden"></span></header>
    <div id="update" class="hidden">clarelay 已更新 · 点这里刷新使用新版本</div>
    <div id="panes">
      <div id="pane-hosts" class="pane"><div id="devs"></div></div>
      <div id="pane-admin" class="pane hidden">
      <section><h3>邀请宿主加入</h3>
        <div class="row"><input class="grow" id="inv-note" placeholder="备注，比如：家里 iMac"><select id="inv-hours" style="width:auto"><option value="1">1 小时</option><option value="24" selected>24 小时</option><option value="168">7 天</option></select><button class="pri" id="inv-new">生成邀请码</button></div>
        <div id="invite-out" class="hidden"></div>
        <div id="inv-list"></div>
      </section><section><h3>宿主</h3><div id="adm-devs"></div></section><section><h3>已授权的设备（手机 / 浏览器）</h3>
        <small style="color:var(--mut)">没授权的浏览器打开 clarelay 和各台电脑的网址都只会看到 404，连登录框都没有。</small>
        <div class="row"><input class="grow" id="enr-note" placeholder="备注，比如：iPad"><button class="pri" id="enr-new">授权新设备</button></div>
        <div id="enroll-out" class="hidden" style="word-break:break-all;font:12px ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;margin-top:6px"></div>
        <div id="adm-sess"></div></section>
      </div>
      <div id="pane-set" class="pane hidden">
        <div class="glabel">客户端</div>
        <div class="group">
          <div class="item" id="reload-app"><span class="grow">更新客户端<small id="reload-sub">重新加载，用上中继上的最新版本</small></span><svg class="ri" id="reload-ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></div>
        </div>
        <div class="glabel">通知</div>
        <div class="group">
          <div class="item"><span class="grow">这台手机接收推送<small>iPhone 要从主屏幕 App 里开启</small></span><button id="btn-push">开启通知</button></div>
          <div class="item" id="push-test"><span class="grow">发一条测试通知</span><span class="chev">›</span></div>
        </div>
        <div class="glabel">中继</div>
        <div class="group">
          <div class="item"><span class="grow">新设备要我批准才生效</span><input type="checkbox" class="sw" id="set-approve"></div>
          <div class="item"><span class="grow">推送通知</span><input type="checkbox" class="sw" id="set-notify"></div>
          <div class="item"><span class="grow">通知正文带前几个字<small>中继能看到这几个字；0 = 只发标题</small></span><input type="number" id="set-chars" min="0" max="200" style="width:80px;text-align:right"></div>
        </div>
        <div class="glabel">账号</div>
        <div class="group">
          <div class="item"><span class="grow" id="me-info"></span><button class="bad" id="btn-logout">退出登录</button></div>
        </div>
      </div>
    </div>
    <nav id="mtabs" aria-label="底部菜单">
      <button type="button" data-tab="hosts" class="on"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>宿主</span></button>
      <button type="button" data-tab="admin"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M12 3l7 3v5c0 4.5-3 8.3-7 9.5-4-1.2-7-5-7-9.5V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span>管理</span></button>
      <button type="button" data-tab="set"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button>
    </nav>
  </aside>
  <main id="main">
    <div id="bar"><button id="back">‹ 宿主</button><span class="t" id="title">选择一台宿主</span><button id="solo" class="hidden" title="单独打开（可添加为这台宿主自己的主屏幕 App）">⇱</button><button id="reload" class="hidden" title="重新加载">↻</button></div>
    <div id="frames"><div id="empty">选择一台宿主</div></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>

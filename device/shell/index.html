<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="clarelay">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>clarelay</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --fg:#111827; --mut:#6b7280; --line:#e5e7eb; --acc:#2563eb; --ok:#16a34a; --bad:#dc2626; --top: env(safe-area-inset-top); --bot: env(safe-area-inset-bottom); }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --card:#151b26; --fg:#e5e7eb; --mut:#9ca3af; --line:#253042; --acc:#60a5fa; } }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
button { font: inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; }
button.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
button.bad { color:var(--bad); }
input, select { font: inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); width:100%; }
.hidden { display:none !important; }
#login { max-width:340px; margin: calc(18vh + var(--top)) auto 0; padding:24px; background:var(--card); border-radius:14px; border:1px solid var(--line); }
#login h1 { margin:0 0 16px; font-size:22px; }
#login input { margin-bottom:10px; }
#login .err { color:var(--bad); min-height:1.4em; font-size:13px; }
#app { display:flex; height:100%; }
#side { width:300px; flex:none; border-right:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; padding-top:var(--top); }
#side header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
#side header b { flex:1; font-size:17px; }
#devs { flex:1; overflow:auto; }
.dev { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.dev.sel { background: color-mix(in srgb, var(--acc) 10%, transparent); }
.dev .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); flex:none; }
.dev .dot.on { background:var(--ok); }
.dev .nm { flex:1; min-width:0; }
.dev .nm small { display:block; color:var(--mut); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--bad); color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
#side footer { padding:10px 14px calc(10px + var(--bot)); border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#bar { display:flex; align-items:center; gap:10px; padding: calc(8px + var(--top)) 12px 8px; border-bottom:1px solid var(--line); background:var(--card); }
#bar .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
#back { display:none; }
#frames { flex:1; position:relative; margin-bottom: var(--bot); }
#frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
#empty { padding:40px; color:var(--mut); text-align:center; }
#admin { flex:1; overflow:auto; padding:16px 16px calc(16px + var(--bot)); }
#admin section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
#admin h3 { margin:0 0 10px; font-size:15px; }
#admin .row { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
#admin .row:first-of-type { border-top:0; }
#admin .row .grow { flex:1; min-width:160px; }
#admin .row small { color:var(--mut); display:block; }
#invite-out { word-break:break-all; font: 12px ui-monospace, Menlo, monospace; background:var(--bg); padding:10px; border-radius:8px; margin-top:10px; }
.pill { font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--mut); }
.pill.pending { color:#b45309; border-color:#f59e0b; }
.pill.revoked { color:var(--bad); border-color:var(--bad); }
@media (max-width: 760px) {
  #side { width:100%; border-right:0; }
  #main { display:none; position:fixed; inset:0; background:var(--bg); z-index:2; }
  body.open #main { display:flex; }
  #back { display:inline-block; }
}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>clarelay</h1>
  <input id="user" placeholder="用户名" autocomplete="username" autocapitalize="off">
  <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="pri" id="lbtn" style="width:100%">登录</button>
</div>
<div id="app" class="hidden">
  <aside id="side">
    <header><b>clarelay</b><span id="total" class="badge hidden"></span></header>
    <div id="devs"></div>
    <footer>
      <button id="btn-admin">管理</button>
      <button id="btn-push">开启通知</button>
      <button id="btn-logout">退出</button>
    </footer>
  </aside>
  <main id="main">
    <div id="bar"><button id="back">‹ 返回</button><span class="t" id="title">选择一台电脑</span><button id="reload" class="hidden" title="重新加载">↻</button></div>
    <div id="frames"><div id="empty">在左边选择一台电脑</div></div>
    <div id="admin" class="hidden">
      <section><h3>邀请电脑加入</h3>
        <div class="row"><input class="grow" id="inv-note" placeholder="备注，比如：家里 iMac"><select id="inv-hours" style="width:auto"><option value="1">1 小时</option><option value="24" selected>24 小时</option><option value="168">7 天</option></select><button class="pri" id="inv-new">生成邀请码</button></div>
        <div id="invite-out" class="hidden"></div>
        <div id="inv-list"></div>
      </section>
      <section><h3>设备</h3><div id="adm-devs"></div></section>
      <section><h3>已登录的浏览器</h3><div id="adm-sess"></div></section>
      <section><h3>设置</h3>
        <div class="row"><span class="grow">新设备要我批准才生效</span><input type="checkbox" id="set-approve" style="width:auto"></div>
        <div class="row"><span class="grow">推送通知</span><input type="checkbox" id="set-notify" style="width:auto"></div>
        <div class="row"><span class="grow">通知正文带前几个字<small>中继能看到这几个字；0 = 只发标题</small></span><input type="number" id="set-chars" min="0" max="200" style="width:90px"></div>
        <div class="row"><button id="push-test">发一条测试通知</button></div>
      </section>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
